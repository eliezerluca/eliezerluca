<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conversor de Markdown para documento HTML formatado para impressão, pronto para salvar como PDF.">
  <title>MD → A4 | Conversor Markdown para PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== ESTADO 1: EDITOR ===== -->
  <div id="editor-view" class="no-print">
    <div class="editor-container">
      <div class="editor-header">
        <div class="editor-brand">
          <div class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14,2 14,8 20,8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10,9 9,9 8,9"/>
            </svg>
          </div>
          <div>
            <h1>MD → PDF</h1>
            <p class="brand-subtitle">Cole seu Markdown e gere um documento profissional</p>
          </div>
        </div>
        <div class="editor-actions">
          <div class="page-size-selector">
            <label for="page-size" class="page-size-label">Tamanho:</label>
            <select id="page-size" class="select-input">
              <option value="A4" selected>A4 (210×297mm)</option>
              <option value="Letter">Letter (216×279mm)</option>
              <option value="Legal">Legal (216×356mm)</option>
            </select>
          </div>
          <button id="btn-sample" class="btn btn-ghost" title="Carregar exemplo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14,2 14,8 20,8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="12" y2="12"/>
              <line x1="15" y1="15" x2="12" y2="12"/>
            </svg>
            <span class="hide-mobile">Exemplo</span>
          </button>
        </div>
      </div>
      <div class="textarea-wrapper">
        <textarea id="md-input" placeholder="# Meu Documento&#10;&#10;Cole seu conteúdo Markdown aqui...&#10;&#10;## Seção&#10;&#10;- Item 1&#10;- Item 2&#10;&#10;| Coluna A | Coluna B |&#10;|----------|----------|&#10;| Valor 1  | Valor 2  |" spellcheck="false"></textarea>
        <div class="textarea-footer">
          <span id="char-count">0 caracteres</span>
        </div>
      </div>
      <button id="btn-generate" class="btn btn-primary btn-lg">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6,9 12,15 18,9"/>
        </svg>
        Gerar documento
      </button>
    </div>
  </div>

  <!-- ===== ESTADO 2: PREVIEW ===== -->
  <div id="preview-view" class="hidden">
    <div class="preview-toolbar no-print">
      <button id="btn-back" class="btn btn-ghost">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12,19 5,12 12,5"/>
        </svg>
        <span class="hide-mobile">Voltar ao editor</span>
      </button>
      <span class="toolbar-title">Preview do documento</span>
      <div class="toolbar-spacer"></div>
      <div class="page-size-selector toolbar-selector">
        <label for="page-size-preview" class="page-size-label">Tamanho:</label>
        <select id="page-size-preview" class="select-input">
          <option value="A4">A4</option>
          <option value="Letter">Letter</option>
          <option value="Legal">Legal</option>
        </select>
      </div>
    </div>
    <div id="preview-container" class="preview-container">
      <!-- Pages rendered here -->
    </div>
    <button id="btn-print" class="btn btn-primary btn-float no-print">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V2h12v7"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      <span class="hide-mobile-sm">Salvar como PDF</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
